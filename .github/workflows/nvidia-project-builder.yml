name: NVIDIA autonomous project builder

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: nvidia-autonomous-project-builder
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'openai/gpt-oss-120b' }}
      ALLOWED_REPO: DylanOSlab/market-data-reliability-lab
      GH_TOKEN: ${{ github.token }}
      MAX_REPAIR_ATTEMPTS: "2"
      AUTO_MERGE: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure Git
        run: |
          git config user.name "nvidia-project-builder[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install validation tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Run autonomous builder
        run: python agent/nvidia_project_builder.py
