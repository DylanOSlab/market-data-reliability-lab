name: NVIDIA PR supervisor

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  schedule:
    - cron: "11,26,41,56 * * * *"

concurrency:
  group: nvidia-pr-supervisor
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'openai/gpt-oss-120b' }}
      ALLOWED_REPO: DylanOSlab/market-data-reliability-lab
      GH_TOKEN: ${{ github.token }}
      MAX_REMOTE_REPAIR_ATTEMPTS: "3"
      MAX_FILES_PER_CHANGE: "24"
      MAX_CHANGED_LINES: "3000"
      AUTO_MERGE: "true"

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run CI monitor, repair, review, and merge
        run: python agent/nvidia_pr_supervisor.py
