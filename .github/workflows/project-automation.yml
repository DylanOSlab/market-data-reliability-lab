name: project-automation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        required: true
        type: choice
        default: health-check
        options:
          - health-check
          - bootstrap-roadmap
          - create-release

      version:
        description: Release version, for example v0.2.0
        required: false
        type: string

      release_title:
        description: Optional release title
        required: false
        type: string

  schedule:
    - cron: "23 2 * * 1"

concurrency:
  group: project-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health-check:
    name: Full project health check
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.operation == 'health-check'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Generate deterministic cases
        run: python scripts/generate_cases.py

      - name: Run regression tests
        run: pytest --junitxml=junit.xml

      - name: Download current BLS data
        run: python scripts/fetch_bls_snapshot.py

      - name: Validate current BLS data
        run: >-
          PYTHONPATH=src python -m mdrlab.cli validate
          fixtures/raw/bls_lns11300000.latest.json

      - name: Create health summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Market Data Reliability Lab"
            echo
            echo "## Automated health check"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Execution time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Python: $(python --version)"
          } > health-summary.md

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: cat health-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            junit.xml
            health-summary.md
            fixtures/raw/bls_lns11300000.latest.json

  bootstrap-roadmap:
    name: Bootstrap v0.2.0 roadmap
    if: github.event.inputs.operation == 'bootstrap-roadmap'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Create CPI dataset issue when absent
        shell: bash
        run: |
          title="Add BLS CPI series CUUR0000SA0"

          existing="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state all \
              --search "\"$title\" in:title" \
              --json title \
              --jq '.[].title'
          )"

          if echo "$existing" | grep -Fxq "$title"; then
            echo "Issue already exists: $title"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$title" \
              --label enhancement \
              --body "$(cat <<'EOF'
          ## Goal

          Add the U.S. Consumer Price Index series `CUUR0000SA0`
          as the second official benchmark dataset.

          ## Acceptance criteria

          - Store an immutable BLS raw fixture
          - Add source provenance
          - Add canonical golden CSV output
          - Add deterministic failure cases
          - Add automated contract tests
          - Validate the series in the upstream smoke workflow
          EOF
          )"
          fi

      - name: Create missing-marker regression issue when absent
        shell: bash
        run: |
          title="Add permanent regression coverage for BLS missing markers"

          existing="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state all \
              --search "\"$title\" in:title" \
              --json title \
              --jq '.[].title'
          )"

          if echo "$existing" | grep -Fxq "$title"; then
            echo "Issue already exists: $title"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$title" \
              --label testing \
              --body "$(cat <<'EOF'
          ## Goal

          Preserve the real-world BLS failures discovered during
          development of v0.1.0.

          ## Cases

          - Missing observation represented by `.`
          - Missing observation represented by `-`

          ## Acceptance criteria

          - Both markers are covered by automated tests
          - Both observations are skipped during normalization
          - Unknown non-numeric values remain rejected
          EOF
          )"
          fi

      - name: Create GitHub Actions upgrade issue when absent
        shell: bash
        run: |
          title="Upgrade GitHub Actions runtime dependencies"

          existing="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state all \
              --search "\"$title\" in:title" \
              --json title \
              --jq '.[].title'
          )"

          if echo "$existing" | grep -Fxq "$title"; then
            echo "Issue already exists: $title"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$title" \
              --label maintenance \
              --body "$(cat <<'EOF'
          ## Goal

          Upgrade workflow dependencies to maintained versions and
          remove Node.js 20 deprecation warnings.

          ## Acceptance criteria

          - CI remains successful on Python 3.10 through 3.13
          - Upstream smoke testing remains successful
          - Test artifacts remain available
          - Node.js 20 warnings are removed
          EOF
          )"
          fi

      - name: Write roadmap summary
        shell: bash
        run: |
          {
            echo "# Roadmap bootstrap completed"
            echo
            echo "The project issues were created when absent."
            echo
            echo "Existing issues were not duplicated."
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Validate and create release
    if: github.event.inputs.operation == 'create-release'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event.inputs.version }}
      RELEASE_TITLE_INPUT: ${{ github.event.inputs.release_title }}

    steps:
      - name: Validate release input
        shell: bash
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "::error::Version is required for create-release."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the format v0.2.0."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse duplicate release
        shell: bash
        run: |
          if gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists."
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Generate deterministic cases
        run: python scripts/generate_cases.py

      - name: Run release tests
        run: pytest --junitxml=junit.xml

      - name: Download current BLS snapshot
        run: python scripts/fetch_bls_snapshot.py

      - name: Validate current BLS snapshot
        run: >-
          PYTHONPATH=src python -m mdrlab.cli validate
          fixtures/raw/bls_lns11300000.latest.json

      - name: Build release archive
        shell: bash
        run: |
          archive="market-data-reliability-lab-${VERSION}.zip"

          zip -r "$archive" . \
            -x ".git/*" \
            -x ".pytest_cache/*" \
            -x "**/__pycache__/*" \
            -x "*.egg-info/*" \
            -x "junit.xml" \
            -x "fixtures/raw/*.latest.json"

          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Select release title
        shell: bash
        run: |
          if [[ -n "$RELEASE_TITLE_INPUT" ]]; then
            title="$RELEASE_TITLE_INPUT"
          else
            title="Market Data Reliability Lab $VERSION"
          fi

          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"

      - name: Create tag and GitHub Release
        shell: bash
        run: |
          gh release create "$VERSION" \
            "$RELEASE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            --verify-tag=false

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.event.inputs.version }}
          retention-days: 90
          path: |
            junit.xml
            fixtures/raw/bls_lns11300000.latest.json
            ${{ env.RELEASE_ARCHIVE }}

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "# Release created"
            echo
            echo "- Version: $VERSION"
            echo "- Title: $RELEASE_TITLE"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo "All tests and the live BLS contract check passed."
          } >> "$GITHUB_STEP_SUMMARY"
