name: upstream-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  bls-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest BLS snapshot
        run: python scripts/fetch_bls_snapshot.py

      - name: Validate BLS response
        run: PYTHONPATH=src python -m mdrlab.cli validate fixtures/raw/bls_lns11300000.latest.json

      - name: Upload latest BLS snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-bls-snapshot
          path: fixtures/raw/bls_lns11300000.latest.json
          if-no-files-found: warn
