name: NVIDIA NIM maintenance agent

on:
  workflow_dispatch:

concurrency:
  group: nim-maintenance-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    name: Generate one small maintenance PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "nim-maintenance-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run NVIDIA NIM maintenance agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'meta/llama-3.1-70b-instruct' }}
          ALLOWED_REPO: DylanOSlab/market-data-reliability-lab
          GH_TOKEN: ${{ github.token }}
        run: python agent/agent.py
