name: Local Qwen maintenance agent

on:
  workflow_dispatch:

concurrency:
  group: local-qwen-maintenance-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    name: Generate one maintenance pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ALLOWED_REPO: DylanOSlab/market-data-reliability-lab
      DEFAULT_BRANCH: main
      LLAMA_CLI: ./llama.cpp/build/bin/llama-cli
      MODEL_SPEC: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "local-qwen-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore llama.cpp build cache
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: |
            llama.cpp/build/bin/llama-cli
          key: llama-cpp-cli-${{ runner.os }}-b4940

      - name: Install build dependencies
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            git \
            libcurl4-openssl-dev

      - name: Download llama.cpp source
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            llama.cpp

      - name: Build llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake \
            -S llama.cpp \
            -B llama.cpp/build \
            -DLLAMA_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build llama.cpp/build \
            --config Release \
            --target llama-cli \
            --parallel 4

      - name: Verify llama.cpp executable
        shell: bash
        run: |
          test -x "$LLAMA_CLI"
          "$LLAMA_CLI" --version

      - name: Run local Qwen maintenance agent
        shell: bash
        run: |
          python agent/local_model_agent.py
